name: تست‌های mlqvoice

# دروازه‌ی ابزارِ گفتار‌به‌متن (voice/). همان دو دستوری که در
# guidelines/lock.json → verify ثبت شده‌اند، اینجا خودکار اجرا می‌شوند —
# وگرنه «دروازه» فقط چیزی است که یک نفر یک بار روی لپ‌تاپش زده.
#
# بازرسِ playwright به این پوشه نمی‌خورد: اینجا پایتون است، نه یک صفحه‌ی HTML.

on:
  push:
    branches: [main]
    paths:
      - 'voice/**'
      - '.github/workflows/voice.yml'
  pull_request:
    paths:
      - 'voice/**'
      - '.github/workflows/voice.yml'
  workflow_dispatch:

concurrency:
  group: voice-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Qt به این‌ها لینک می‌شود حتی در حالتِ offscreen؛ بدونشان خودِ import
      # با libEGL.so.1 not found می‌افتد و آدم فکر می‌کند کد خراب است.
      - name: کتابخانه‌های سیستمیِ Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: نصبِ وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: لینت
        run: |
          ruff check .
          ruff format --check .

      - name: تست
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      # هر سه فایلِ داده در زمانِ اجرا از دیسک خوانده می‌شوند. اگر یکی‌شان JSONِ
      # خراب باشد، تست‌ها می‌گیرندش — ولی این یکی می‌گوید کدام فایل، بدونِ
      # اینکه لازم باشد ردِ خطای pytest را دنبال کنی.
      - name: سلامتِ فایل‌های داده
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = 0
          for p in sorted(pathlib.Path("src/mlqvoice").rglob("*.json")):
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  print(f"::error file={p}::JSON خراب است — {exc}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: خلاصه
        if: always()
        run: |
          {
            echo '### دروازه‌ی mlqvoice'
            echo ''
            echo "- تست: \`python -m pytest -q\`"
            echo "- لینت: \`ruff check .\` و \`ruff format --check .\`"
          } >> "$GITHUB_STEP_SUMMARY"
