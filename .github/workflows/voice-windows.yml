name: ساختِ mlqvoice.exe روی ویندوز

# دو کار، و کارِ اول از کارِ دوم مهم‌تر است:
#
#   ۱. تست‌ها را روی یک ماشینِ **واقعیِ ویندوز** اجرا می‌کند. تا امروز همه‌ی
#      وارسی‌ها روی لینوکس بودند، یعنی چیدمانِ ساختارهای Win32، مسیرِ APPDATA و
#      رفتارِ Qt روی ویندوز هیچ‌وقت اجرا نشده بودند.
#   ۲. exe را می‌سازد و به‌عنوان artifact می‌گذارد تا بشود نصبش کرد.
#
# روی هر شاخه‌ای اجرا می‌شود، نه فقط main: تا وقتی exe ساخته و آزمایش نشده،
# مرج کردنش یعنی همان «بده و بعد چند دور دیباگ کنیم».

on:
  push:
    paths:
      - 'voice/**'
      - '.github/workflows/voice-windows.yml'
  pull_request:
    paths:
      - 'voice/**'
      - '.github/workflows/voice-windows.yml'
  workflow_dispatch:

concurrency:
  group: voice-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # سقفِ پیش‌فرضِ GitHub شش ساعت است. یک بسته‌ی گیرکرده نباید آن‌قدر بایستد؛
    # بهتر است زود بمیرد تا لاگش خوانده شود.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: voice
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # صریح، نه «رانر اتفاقاً دارد»: تست‌ها حالا شبیه‌سازِ صفحه‌ی تشخیص را با
      # node اجرا می‌کنند و اگر نباشد عمداً قرمز می‌دهند، نه رد (CORE-12).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: نصبِ وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: لینت
        run: |
          ruff check .
          ruff format --check .

      # این مرحله چیزی است که تا حالا نداشتیم: همان ۱۵۶ تست، روی ویندوز.
      - name: تست روی ویندوزِ واقعی
        env:
          QT_QPA_PLATFORM: offscreen
          # لاگِ گیت‌هاب UTF-8 است ولی پایتون روی ویندوز کدپیجِ ANSI را برمی‌دارد،
          # پس گزارشِ فارسیِ یک تستِ افتاده به `س...` تبدیل می‌شود — می‌خوانی‌اش
          # ولی نمی‌فهمی. تست‌های خودِ رمزگذاری این را تضعیف نمی‌کنند چون هرکدام
          # کدپیجِ فرزندشان را صریح تعیین می‌کنند.
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q

      - name: ساختِ exe
        run: |
          python -m PyInstaller `
            --noconfirm --clean --onedir --windowed `
            --name mlqvoice `
            --add-data "src/mlqvoice/text/data;mlqvoice/text/data" `
            --add-data "src/mlqvoice/web;mlqvoice/web" `
            --add-data "src/mlqvoice/assets;mlqvoice/assets" `
            --collect-all comtypes `
            --hidden-import pycaw `
            --hidden-import pycaw.pycaw `
            --exclude-module tkinter `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtCharts `
            --paths src `
            scripts/launcher.py

      # چرا onedir و نه onefile: بسته‌ی تک‌فایلی هر بار اجرا خودش را در پوشه‌ی
      # موقت باز می‌کند و همین چند ثانیه‌ی اولِ «هیچ کاری نمی‌کند» را می‌سازد.
      # onedir همان لحظه بالا می‌آید. بهایش این است که خروجی یک پوشه است، پس
      # برای دانلود zip می‌شود.

      # «ساخته شد» با «بالا می‌آید» یکی نیست. این دو فرمان خودِ exe را اجرا
      # می‌کنند: اگر PySide6 داخلش نرفته باشد یا فایل‌های JSON با --add-data
      # همراه نشده باشند، همین‌جا می‌افتد، نه روی کامپیوترِ کاربر.
      - name: آزمایشِ خودِ exe
        run: |
          $exe = (Resolve-Path "dist\mlqvoice\mlqvoice.exe").Path
          if (-not (Test-Path $exe)) { throw "exe ساخته نشد" }

          # چرا Start-Process و نه `& $exe`: بسته با --windowed ساخته می‌شود، یعنی
          # زیرسیستمش GUI است و PowerShell منتظرش نمی‌مانَد — $LASTEXITCODE خالی
          # برمی‌گردد و آزمایش، درست وقتی exe سالم است، شکست می‌دهد.
          # Start-Process واقعاً منتظر می‌مانَد و کدِ خروجیِ حقیقی را می‌دهد.
          # ولی -Wait بدونِ مهلت یعنی اگر بسته یک بار برنگردد، کار تا سقفِ شش‌ساعته‌ی
          # GitHub می‌ایستد و لاگ هم تا آن موقع خوانده نمی‌شود — یعنی دقیقاً وقتی
          # که بیشترین نیاز را به خبر داری، هیچ خبری نداری. WaitForExit با مهلت،
          # گیر کردن را به یک شکستِ سریع تبدیل می‌کند که اسمِ فرمان را می‌گوید.
          function Invoke-Exe {
            # نامش $ExeArgs است نه $Args: در PowerShell، $args متغیرِ خودکارِ
            # زبان است و پارامتری با آن نام هیچ‌وقت bind نمی‌شود — آرایه‌ی خالی
            # می‌رسید، exe بی‌آرگومان اجرا می‌شد و به‌جای زیردستور کلِ برنامه‌ی
            # گرافیکی بالا می‌آمد و تا ابد می‌ماند.
            param([string]$Label, [string[]]$ExeArgs, [int]$TimeoutMs = 90000)
            $o = [System.IO.Path]::GetTempFileName()
            $e = [System.IO.Path]::GetTempFileName()
            $p = Start-Process -FilePath $exe -ArgumentList $ExeArgs -PassThru `
                   -RedirectStandardOutput $o -RedirectStandardError $e
            if (-not $p.WaitForExit($TimeoutMs)) {
              try { $p.Kill() } catch { }
              $partial = (Get-Content $o -Raw -Encoding utf8)
              Write-Host "خروجیِ ناقص تا لحظه‌ی کشتن: $partial"
              throw "exe در «$Label» بعد از $($TimeoutMs/1000) ثانیه برنگشت — گیر کرده"
            }
            $p.WaitForExit()   # اطمینان از تخلیه‌ی خروجی
            $out = (Get-Content $o -Raw -Encoding utf8)
            $err = (Get-Content $e -Raw -Encoding utf8)
            Remove-Item $o, $e -Force
            Write-Host "--- $Label (کد $($p.ExitCode)) ---"
            if ($out) { Write-Host $out }
            if ($err) { Write-Host "stderr: $err" }
            if ($p.ExitCode -ne 0) { throw "exe با $Label کد $($p.ExitCode) داد" }
            return $out
          }

          $v = Invoke-Exe -Label '--version' -ExeArgs @('--version')
          if ($v -notmatch 'mlqvoice') { throw "--version نامِ برنامه را نگفت" }

          # check دیکشنری را از فایل‌های همراه‌شده می‌سازد — یعنی --add-data را می‌سنجد
          $c = Invoke-Exe -Label 'check' -ExeArgs @('check')
          if ($c -notmatch 'alt\+space') { throw "check کلیدِ میان‌بُر را نگفت" }

          # و یک جمله را واقعاً از خطِ لوله رد می‌کند
          $s = Invoke-Exe -Label 'say' -ExeArgs @('say', 'کامیت', 'کن', 'نقطه')
          if ($s -notmatch 'commit') { throw "دیکشنری داخلِ exe کار نکرد: $s" }

          # مهم‌ترین آزمایش: check و say اصلاً Qt را صدا نمی‌زنند، پس اگر PySide6
          # یا پلاگینِ سکویش داخلِ بسته نرفته باشد هر دو سبز رد می‌شوند و کاربر
          # با یک آیکن می‌مانَد که دوبار کلیک کردنش هیچ کاری نمی‌کند.
          # selftest کادر و آیکن و صفحه‌ی تشخیص را واقعاً می‌سازد.
          $t = Invoke-Exe -Label 'selftest' -ExeArgs @('selftest')
          if ($t -notmatch 'selftest ok') { throw "selftest تأیید نکرد: $t" }

          # pycaw می‌رسد از راهِ comtypes که رابط‌هایش را در زمانِ اجرا می‌سازد —
          # همان الگویی که بسته‌بند نمی‌تواند دنبالش کند. اگر جا بماند، برنامه
          # بالا می‌آید و فقط مکثِ پخش بی‌صدا هیچ‌وقت اتفاق نمی‌افتد. selftest با
          # نبودنش کدِ ۱ می‌دهد؛ این خط وضعیتش را در لاگ هم می‌گذارد. روی رانر
          # کارتِ صدا نیست، پس «خاموش» انتظارِ درستی است، نه شکست.
          if ($t -notmatch 'مکثِ پخش') { throw "selftest وضعیتِ مکثِ پخش را نگفت" }

          Compress-Archive -Path "dist\mlqvoice\*" -DestinationPath "dist\mlqvoice.zip" -Force
          $size = [math]::Round((Get-Item "dist\mlqvoice.zip").Length / 1MB, 1)
          Write-Host "اندازه‌ی بسته: $size مگابایت"
          "EXE_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # این مرحله از یک اشتباه زاده شد: یک بار آرگومان‌ها به exe نرسیدند، برنامه
      # به‌جای زیردستور کاملاً بالا آمد، و لاگِ پاک‌سازیِ رانر سه پروسه‌ی chrome
      # را نشان داد. یعنی همین محیط *می‌تواند* کلِ مسیرِ راه‌اندازی را اجرا کند —
      # چیزی که تا آن لحظه در فهرستِ «تست‌نشده» بود. حالا عمداً انجامش می‌دهیم.
      #
      # ملاکِ موفقیت خطِ لاگِ «ready on» است، نه صرفاً زنده ماندنِ پروسه: اگر
      # RegisterHotKey شکست بخورد، برنامه یک پنجره‌ی خطا نشان می‌دهد و همچنان
      # زنده می‌مانَد — یعنی «هنوز اجرا می‌شود» شاهدِ راه‌اندازیِ موفق نیست.
      - name: آزمایشِ راه‌اندازیِ کاملِ برنامه
        run: |
          $exe = (Resolve-Path "dist\mlqvoice\mlqvoice.exe").Path
          $err = Join-Path $env:RUNNER_TEMP 'app-err.txt'
          $out = Join-Path $env:RUNNER_TEMP 'app-out.txt'
          $before = @(Get-Process chrome, msedge -ErrorAction SilentlyContinue).Id

          $app = Start-Process -FilePath $exe -PassThru `
                   -RedirectStandardOutput $out -RedirectStandardError $err

          $ready = $false
          $deadline = (Get-Date).AddSeconds(75)
          while ((Get-Date) -lt $deadline) {
            if ($app.HasExited) { break }
            $log = Get-Content $err -Raw -Encoding utf8 -ErrorAction SilentlyContinue
            if ($log -match 'ready on') { $ready = $true; break }
            Start-Sleep -Milliseconds 500
          }

          $log = Get-Content $err -Raw -Encoding utf8 -ErrorAction SilentlyContinue
          Write-Host "--- لاگِ برنامه ---"
          if ($log) { Write-Host $log } else { Write-Host "(خالی)" }

          $chromeNow = @(Get-Process chrome, msedge -ErrorAction SilentlyContinue)
          $ours = @($chromeNow | Where-Object { $before -notcontains $_.Id })

          # پاک‌سازی قبل از هر throw، وگرنه رانر با پروسه‌های یتیم می‌مانَد
          foreach ($p in $ours) { try { $p.Kill() } catch { } }
          if (-not $app.HasExited) { try { $app.Kill() } catch { } }
          # بسته‌ی onefile یک پروسه‌ی فرزند می‌سازد و کشتنِ والد او را نمی‌کشد؛
          # در اجرای قبل یک mlqvoiceِ یتیم در پاک‌سازیِ رانر باقی مانده بود.
          Get-Process mlqvoice -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          if ($app.HasExited -and -not $ready) {
            throw "برنامه بالا نماند — کدِ خروجی $($app.ExitCode). لاگ بالاست."
          }
          if (-not $ready) {
            throw "برنامه تا ۷۵ ثانیه «ready on» نگفت — راه‌اندازی نیمه‌کاره ماند"
          }
          if ($ours.Count -eq 0) {
            throw "مرورگرِ تشخیصِ گفتار بالا نیامد — بدونِ آن هیچ صدایی تبدیل نمی‌شود"
          }
          Write-Host "راه‌اندازی کامل شد و $($ours.Count) پروسه‌ی مرورگر بالا آمد."

      - name: بارگذاریِ exe
        uses: actions/upload-artifact@v4
        with:
          name: mlqvoice-exe
          path: voice/dist/mlqvoice.zip
          if-no-files-found: error
          retention-days: 30

      - name: خلاصه
        if: always()
        run: |
          @(
            '### mlqvoice روی ویندوز'
            ''
            "- تست‌ها روی ``windows-latest`` اجرا شدند"
            "- exe: ``$env:EXE_SIZE`` مگابایت"
            '- از بخشِ Artifacts همین اجرا دانلودش کن'
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  # artifactها موقت‌اند: با `retention-days: 30` گیت‌هاب خودش پاکشان می‌کند و
  # لینک ۴۰۴ می‌دهد. برای فایلی که مالک باید هر وقت خواست دوباره نصبش کند،
  # این یعنی هر بار باید وارد Actions شود و یک build تازه بزند.
  #
  # Release پاک نمی‌شود. و عمداً یک برچسبِ **چرخان** است (`voice-latest`) نه
  # نسخه‌دار، چون خواسته یک **نشانیِ ثابت** بود که بشود ذخیره‌اش کرد:
  #
  #   https://github.com/mhmdpwrpdram801-cpu/modlandqeshm/releases/download/voice-latest/mlqvoice.zip
  #
  # بهایش این است که نسخه‌ی قبلی نگه داشته نمی‌شود — با یک کاربر و یک exe که
  # همیشه از آخرین main ساخته می‌شود، معامله‌ی درستی است.
  release:
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # تنها جایی در این گردش‌کار که اجازه‌ی نوشتن دارد؛ کارِ build فقط‌خواندنی می‌مانَد.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mlqvoice-exe

      - name: انتشار روی نشانیِ ثابت
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: voice-latest
        run: |
          set -euo pipefail
          size=$(stat -c %s mlqvoice.zip)
          notes="ساخته‌شده از \`${GITHUB_SHA:0:7}\` — $(date -u '+%Y-%m-%d %H:%M UTC')

          zip را باز کن و داخلش mlqvoice.exe را اجرا کن. این برچسب همیشه به
          تازه‌ترین نسخه اشاره می‌کند، پس نشانی‌اش عوض نمی‌شود:

          \`\`\`
          https://github.com/${GITHUB_REPOSITORY}/releases/download/voice-latest/mlqvoice.zip
          \`\`\`

          ویندوز اخطارِ SmartScreen می‌دهد چون فایل امضای دیجیتال ندارد:
          More info ← Run anyway."

          # `--repo` روی هر چهار فرمان لازم است، نه از سرِ وسواس: این کار مخزن را
          # checkout نمی‌کند (فقط artifact را می‌گیرد)، پس هیچ ریموتِ گیتی نیست که
          # gh بتواند از رویش حدس بزند کجا را می‌گوید. بدونش با
          # «fatal: not a git repository» می‌افتد — و اولین بار همین‌طور افتاد.
          #
          # جایگزینی به‌جای حذف و ساختِ دوباره: پاک کردنِ Release یک فاصله‌ی
          # چندثانیه‌ای می‌سازد که در آن همان نشانیِ «ثابت» ۴۰۴ می‌دهد.
          # onefile گذشته یک mlqvoice.exe روی همین Release گذاشته بود؛ اگر بماند،
          # لینکِ قدیمی یک نسخه‌ی منجمد را برای همیشه سرو می‌کند.
          gh release delete-asset "$TAG" mlqvoice.exe --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" mlqvoice.zip --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --notes "$notes" --title "mlqvoice (تازه‌ترین)"
          else
            gh release create "$TAG" mlqvoice.zip --repo "$GITHUB_REPOSITORY" \
              --title "mlqvoice (تازه‌ترین)" --notes "$notes" --latest
          fi
          echo "منتشر شد: $size بایت"

      # «فرمان خطا نداد» با «فایل واقعاً آنجاست» یکی نیست. این مرحله همان
      # نشانیِ عمومی را می‌گیرد و اندازه‌اش را با فایلِ ساخته‌شده مقابله می‌کند —
      # وگرنه یک Releaseِ خالی یا نیمه‌آپلود سبز رد می‌شد.
      - name: وارسیِ اینکه لینک واقعاً کار می‌کند
        env:
          TAG: voice-latest
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/mlqvoice.zip"
          expected=$(stat -c %s mlqvoice.zip)
          # tolower، نه IGNORECASE: آن یکی افزونه‌ی gawk است و mawk — که awkِ
          # پیش‌فرضِ اوبونتوست — بی‌صدا نادیده‌اش می‌گیرد. نتیجه‌اش این می‌شد که
          # فقط `content-length` کوچکِ پاسخِ ۳۰۲ می‌خواند، یعنی صفر، و این وارسی
          # روی یک Releaseِ کاملاً سالم قرمز می‌داد. اندازه گرفته شد.
          for attempt in 1 2 3 4 5; do
            served=$(curl -sIL "$url" | awk '
              { line = tolower($0); if (line ~ /^content-length:/) v = $2 }
              END { gsub(/\r/, "", v); print v + 0 }')
            if [ "$served" = "$expected" ]; then
              echo "لینک جواب داد و اندازه خواند: $expected بایت"
              echo "- دانلودِ دائمی: <$url>" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "تلاشِ $attempt: اندازه‌ی سرو‌شده «${served:-هیچ}» با $expected نخواند؛ صبر…"
            sleep 5
          done
          echo "::error::لینکِ Release بعد از ۵ تلاش فایلِ درست را نداد: $url"
          exit 1
