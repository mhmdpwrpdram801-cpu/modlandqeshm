name: ساختِ mlqvoice.exe روی ویندوز

# دو کار، و کارِ اول از کارِ دوم مهم‌تر است:
#
#   ۱. تست‌ها را روی یک ماشینِ **واقعیِ ویندوز** اجرا می‌کند. تا امروز همه‌ی
#      وارسی‌ها روی لینوکس بودند، یعنی چیدمانِ ساختارهای Win32، مسیرِ APPDATA و
#      رفتارِ Qt روی ویندوز هیچ‌وقت اجرا نشده بودند.
#   ۲. exe را می‌سازد و به‌عنوان artifact می‌گذارد تا بشود نصبش کرد.
#
# روی هر شاخه‌ای اجرا می‌شود، نه فقط main: تا وقتی exe ساخته و آزمایش نشده،
# مرج کردنش یعنی همان «بده و بعد چند دور دیباگ کنیم».

on:
  push:
    paths:
      - 'voice/**'
      - '.github/workflows/voice-windows.yml'
  pull_request:
    paths:
      - 'voice/**'
      - '.github/workflows/voice-windows.yml'
  workflow_dispatch:

concurrency:
  group: voice-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # سقفِ پیش‌فرضِ GitHub شش ساعت است. یک بسته‌ی گیرکرده نباید آن‌قدر بایستد؛
    # بهتر است زود بمیرد تا لاگش خوانده شود.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: voice
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # صریح، نه «رانر اتفاقاً دارد»: تست‌ها حالا شبیه‌سازِ صفحه‌ی تشخیص را با
      # node اجرا می‌کنند و اگر نباشد عمداً قرمز می‌دهند، نه رد (CORE-12).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: نصبِ وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: لینت
        run: |
          ruff check .
          ruff format --check .

      # اسکریپتِ نصب روی کامپیوترِ مالک اجرا می‌شود، نه اینجا — پس اگر یک
      # پرانتز جا افتاده باشد، جایی که معلوم می‌شود دستِ اوست. پارسرِ خودِ
      # PowerShell بدونِ اجرا کردنش این را می‌گیرد.
      - name: وارسیِ نحوِ اسکریپتِ نصب
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts\install.ps1').Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }
            throw "install.ps1 خطای نحوی دارد"
          }
          $body = Get-Content 'scripts\install.ps1' -Raw -Encoding utf8
          if ($body -notmatch '__SHA256__') {
            throw "جای‌نگه‌دارِ اثرِ انگشت در install.ps1 نیست — انتشار نمی‌تواند مهرش بزند"
          }

          # BOM اختیاری نیست: PowerShell 5.1 فایلِ .ps1 بدونِ آن را با کدپیجِ ANSI
          # می‌خوانَد و هر رشته‌ی فارسی خراب درمی‌آید. یک بار همین اتفاق افتاد و
          # خطی که می‌گفت «از منوی استارت اجرا کن» ناخوانا شد، پس کاربر ماند که
          # بعدش چه کند. سنجیدنش سه بایت است؛ نبودش یک نصبِ گنگ.
          $head = [System.IO.File]::ReadAllBytes((Resolve-Path 'scripts\install.ps1').Path)[0..2]
          if (($head -join ',') -ne '239,187,191') {
            throw "install.ps1 بدونِ BOM است — فارسی‌اش روی PowerShell 5.1 خراب می‌شود"
          }
          Write-Host "install.ps1 سالم است (نحو + BOM)."

      # این مرحله چیزی است که تا حالا نداشتیم: همان ۱۵۶ تست، روی ویندوز.
      - name: تست روی ویندوزِ واقعی
        env:
          QT_QPA_PLATFORM: offscreen
          # لاگِ گیت‌هاب UTF-8 است ولی پایتون روی ویندوز کدپیجِ ANSI را برمی‌دارد،
          # پس گزارشِ فارسیِ یک تستِ افتاده به `س...` تبدیل می‌شود — می‌خوانی‌اش
          # ولی نمی‌فهمی. تست‌های خودِ رمزگذاری این را تضعیف نمی‌کنند چون هرکدام
          # کدپیجِ فرزندشان را صریح تعیین می‌کنند.
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q

      # جدا از مرحله‌ی بالا، و عمداً: آن‌ها offscreen اجرا می‌شوند و QApplication
      # پلتفرمش را یک‌بار برای همیشه انتخاب می‌کند. این یکی به پنجره‌ی واقعی نیاز
      # دارد — کلیدها از راهِ SendInput می‌آیند و باید به پنجره‌ای برسند که سیستم‌عامل
      # هم قبولش دارد. پس پروسه‌ی جدا، بدونِ QT_QPA_PLATFORM.
      - name: مسیرِ کامل با پنجره و کلیدِ واقعی
        env:
          MLQ_E2E: '1'
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/test_end_to_end_windows.py -q

      - name: ساختِ exe
        run: |
          python -m PyInstaller `
            --noconfirm --clean --onedir --windowed `
            --name mlqvoice `
            --add-data "src/mlqvoice/text/data;mlqvoice/text/data" `
            --add-data "src/mlqvoice/web;mlqvoice/web" `
            --add-data "src/mlqvoice/assets;mlqvoice/assets" `
            --collect-all comtypes `
            --hidden-import pycaw `
            --hidden-import pycaw.pycaw `
            --exclude-module tkinter `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtCharts `
            --paths src `
            scripts/launcher.py

      # چرا onedir و نه onefile: بسته‌ی تک‌فایلی هر بار اجرا خودش را در پوشه‌ی
      # موقت باز می‌کند و همین چند ثانیه‌ی اولِ «هیچ کاری نمی‌کند» را می‌سازد.
      # onedir همان لحظه بالا می‌آید. بهایش این است که خروجی یک پوشه است، پس
      # برای دانلود zip می‌شود.

      # «ساخته شد» با «بالا می‌آید» یکی نیست. این دو فرمان خودِ exe را اجرا
      # می‌کنند: اگر PySide6 داخلش نرفته باشد یا فایل‌های JSON با --add-data
      # همراه نشده باشند، همین‌جا می‌افتد، نه روی کامپیوترِ کاربر.
      - name: آزمایشِ خودِ exe
        run: |
          $exe = (Resolve-Path "dist\mlqvoice\mlqvoice.exe").Path
          if (-not (Test-Path $exe)) { throw "exe ساخته نشد" }

          # چرا Start-Process و نه `& $exe`: بسته با --windowed ساخته می‌شود، یعنی
          # زیرسیستمش GUI است و PowerShell منتظرش نمی‌مانَد — $LASTEXITCODE خالی
          # برمی‌گردد و آزمایش، درست وقتی exe سالم است، شکست می‌دهد.
          # Start-Process واقعاً منتظر می‌مانَد و کدِ خروجیِ حقیقی را می‌دهد.
          # ولی -Wait بدونِ مهلت یعنی اگر بسته یک بار برنگردد، کار تا سقفِ شش‌ساعته‌ی
          # GitHub می‌ایستد و لاگ هم تا آن موقع خوانده نمی‌شود — یعنی دقیقاً وقتی
          # که بیشترین نیاز را به خبر داری، هیچ خبری نداری. WaitForExit با مهلت،
          # گیر کردن را به یک شکستِ سریع تبدیل می‌کند که اسمِ فرمان را می‌گوید.
          function Invoke-Exe {
            # نامش $ExeArgs است نه $Args: در PowerShell، $args متغیرِ خودکارِ
            # زبان است و پارامتری با آن نام هیچ‌وقت bind نمی‌شود — آرایه‌ی خالی
            # می‌رسید، exe بی‌آرگومان اجرا می‌شد و به‌جای زیردستور کلِ برنامه‌ی
            # گرافیکی بالا می‌آمد و تا ابد می‌ماند.
            param([string]$Label, [string[]]$ExeArgs, [int]$TimeoutMs = 90000)
            $o = [System.IO.Path]::GetTempFileName()
            $e = [System.IO.Path]::GetTempFileName()
            $p = Start-Process -FilePath $exe -ArgumentList $ExeArgs -PassThru `
                   -RedirectStandardOutput $o -RedirectStandardError $e
            if (-not $p.WaitForExit($TimeoutMs)) {
              try { $p.Kill() } catch { }
              $partial = (Get-Content $o -Raw -Encoding utf8)
              Write-Host "خروجیِ ناقص تا لحظه‌ی کشتن: $partial"
              throw "exe در «$Label» بعد از $($TimeoutMs/1000) ثانیه برنگشت — گیر کرده"
            }
            $p.WaitForExit()   # اطمینان از تخلیه‌ی خروجی
            $out = (Get-Content $o -Raw -Encoding utf8)
            $err = (Get-Content $e -Raw -Encoding utf8)
            Remove-Item $o, $e -Force
            Write-Host "--- $Label (کد $($p.ExitCode)) ---"
            if ($out) { Write-Host $out }
            if ($err) { Write-Host "stderr: $err" }
            if ($p.ExitCode -ne 0) { throw "exe با $Label کد $($p.ExitCode) داد" }
            return $out
          }

          $v = Invoke-Exe -Label '--version' -ExeArgs @('--version')
          if ($v -notmatch 'mlqvoice') { throw "--version نامِ برنامه را نگفت" }

          # check دیکشنری را از فایل‌های همراه‌شده می‌سازد — یعنی --add-data را می‌سنجد
          $c = Invoke-Exe -Label 'check' -ExeArgs @('check')
          if ($c -notmatch 'alt\+space') { throw "check کلیدِ میان‌بُر را نگفت" }

          # و یک جمله را واقعاً از خطِ لوله رد می‌کند
          $s = Invoke-Exe -Label 'say' -ExeArgs @('say', 'کامیت', 'کن', 'نقطه')
          if ($s -notmatch 'commit') { throw "دیکشنری داخلِ exe کار نکرد: $s" }

          # مهم‌ترین آزمایش: check و say اصلاً Qt را صدا نمی‌زنند، پس اگر PySide6
          # یا پلاگینِ سکویش داخلِ بسته نرفته باشد هر دو سبز رد می‌شوند و کاربر
          # با یک آیکن می‌مانَد که دوبار کلیک کردنش هیچ کاری نمی‌کند.
          # selftest کادر و آیکن و صفحه‌ی تشخیص را واقعاً می‌سازد.
          $t = Invoke-Exe -Label 'selftest' -ExeArgs @('selftest')
          if ($t -notmatch 'selftest ok') { throw "selftest تأیید نکرد: $t" }

          # pycaw می‌رسد از راهِ comtypes که رابط‌هایش را در زمانِ اجرا می‌سازد —
          # همان الگویی که بسته‌بند نمی‌تواند دنبالش کند. اگر جا بماند، برنامه
          # بالا می‌آید و فقط مکثِ پخش بی‌صدا هیچ‌وقت اتفاق نمی‌افتد. selftest با
          # نبودنش کدِ ۱ می‌دهد؛ این خط وضعیتش را در لاگ هم می‌گذارد. روی رانر
          # کارتِ صدا نیست، پس «خاموش» انتظارِ درستی است، نه شکست.
          if ($t -notmatch 'مکثِ پخش') { throw "selftest وضعیتِ مکثِ پخش را نگفت" }

          Compress-Archive -Path "dist\mlqvoice\*" -DestinationPath "dist\mlqvoice.zip" -Force
          $size = [math]::Round((Get-Item "dist\mlqvoice.zip").Length / 1MB, 1)
          Write-Host "اندازه‌ی بسته: $size مگابایت"
          "EXE_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # مرحله‌ی بالا خروجی را با -RedirectStandardOutput می‌گیرد، و همین یک
      # نقطه‌ی کورِ کامل می‌سازد: هندلِ هدایت‌شده یک هندلِ واقعی است و کدپیجِ
      # کنسول هم اصلاً واردِ ماجرا نمی‌شود. یعنی تنها مسیری که همیشه کار می‌کند،
      # تنها مسیری بود که سنجیده می‌شد. باگِ واقعی‌اش هم همان‌جا پنهان ماند:
      # launcher به کنسولِ پوسته وصل می‌شد ولی کدپیجش را UTF-8 نمی‌کرد، پس
      # فارسیِ خروجی روی صفحه‌ی مالک به شکلِ Ø§Ø¬… درمی‌آمد.
      #
      # این مرحله یک کنسولِ واقعی می‌سازد، exe را داخلش اجرا می‌کند بدونِ هیچ
      # هدایتی، و بعد نویسه‌ها را از خودِ صفحه می‌خواند — تنها راهِ دیدنِ چیزی که
      # کاربر می‌بیند.
      - name: خروجی روی کنسولِ واقعی، نه هدایت‌شده
        env:
          # بدونِ این، پایتون برای لوله‌ی لاگ کدپیجِ ANSI را برمی‌دارد و اولین
          # `print`ِ فارسیِ خودِ ابزار با UnicodeEncodeError می‌افتد. یک بار
          # همین شد و کدِ خروجی ۱ برگشت — یعنی «exe شکست خورد» — در حالی که
          # exe اصلاً به آن نرسیده بود.
          PYTHONIOENCODING: utf-8
        run: |
          $exe = (Resolve-Path "dist\mlqvoice\mlqvoice.exe").Path
          function Read-Console {
            param([string]$Label, [string[]]$ExeArgs)
            $file = Join-Path $env:RUNNER_TEMP "console-$Label.txt"
            # Out-Host و نه رها کردنش: خروجیِ یک فرمانِ بومی داخلِ تابع وارد
            # خطِ لوله می‌شود و همراهِ return برمی‌گردد، یعنی متنِ صفحه با
            # پیام‌های خودِ ابزار قاطی می‌شد و بررسی‌ها روی چیزِ اشتباه می‌نشستند.
            python scripts\console_probe.py $exe $file @ExeArgs | Out-Host
            $code = $LASTEXITCODE

            # صفحه را **قبل از** هر throw نشان بده. اگر exe کدِ غیرِ صفر بدهد،
            # همان چیزی که روی صفحه نوشته تنها سرنخِ چراییِ آن است؛ پنهان کردنش
            # پشتِ یک استثنا یعنی دورِ بعد دوباره کورکورانه حدس بزنیم.
            $text = ''
            if (Test-Path $file) { $text = (Get-Content $file -Raw -Encoding utf8) }
            Write-Host "--- آنچه روی صفحه آمد ($Label) ---"
            Write-Host $(if ($text) { $text } else { '(خالی)' })

            # کدِ ۲ یعنی خودِ آزمایش نتوانست کار کند. این را «برنامه چیزی چاپ
            # نکرد» نخوان — دو چیزِ کاملاً متفاوت‌اند و قاطی کردنشان یعنی چند
            # ساعت دنبالِ باگی گشتن که وجود ندارد.
            if ($code -eq 2) { throw "ابزارِ آزمایشِ کنسول کار نکرد (نه برنامه) — لاگ بالاست" }
            if ($code -ne 0) { throw "exe در «$Label» روی کنسول کدِ $code داد" }
            return $text
          }

          $c = Read-Console -Label 'check' -ExeArgs @('check')
          if (-not $c) { throw "exe روی کنسولِ واقعی هیچ چیزی ننوشت — کاربر هم هیچ نمی‌بیند" }
          if ($c -notmatch 'alt\+space') { throw "خروجیِ check روی کنسول ناقص بود: $c" }
          # فارسی هم باید خوانا باشد، نه علامتِ سؤال: کدپیجِ کنسول پیش‌فرض ANSI
          # است و بدونِ UTF-8 کردنش خروجی «هست ولی به درد نمی‌خورد».
          #
          # **رشته‌ی محک عمداً بدونِ علامتِ ترکیبی و نیم‌فاصله است، و این را
          # عوض نکن.** ReadConsoleOutputCharacterW صفحه را خانه‌به‌خانه
          # می‌خوانَد و کسره/ضمه (U+0650، U+064F) و ZWNJ (U+200C) از آن سالم
          # برنمی‌گردند. اندازه گرفته شد: «زبان» و «ارقام» و «نوشتن» دست‌نخورده
          # آمدند، ولی «کلیدِ میان‌بُر» شد «کلی? میا??ر». این محدودیتِ **ابزارِ
          # خواندن** است، نه خروجیِ برنامه — پس با چنین رشته‌ای نمی‌شود قضاوت
          # کرد. قبلاً روی 'کلید' بود و فقط به این دلیل سبز می‌ماند که یک خطِ
          # دیگر «کلیدی» (بی‌کسره) چاپ می‌کرد؛ آن خط که حذف شد، قرمز داد.
          if ($c -notmatch 'زبان') { throw "فارسیِ خروجی روی کنسول خوانا نبود: $c" }

          # و یک دستورِ دوم، چون check تنها راهِ خروجی نیست: `learn` همان چیزی
          # است که مالک واقعاً می‌زند وقتی می‌خواهد ببیند برنامه چه یاد گرفته.
          $l = Read-Console -Label 'learn' -ExeArgs @('learn')
          if (-not $l) { throw "دستورِ learn روی کنسول هیچ چیزی ننوشت" }

      # این مرحله از یک اشتباه زاده شد: یک بار آرگومان‌ها به exe نرسیدند، برنامه
      # به‌جای زیردستور کاملاً بالا آمد، و لاگِ پاک‌سازیِ رانر سه پروسه‌ی chrome
      # را نشان داد. یعنی همین محیط *می‌تواند* کلِ مسیرِ راه‌اندازی را اجرا کند —
      # چیزی که تا آن لحظه در فهرستِ «تست‌نشده» بود. حالا عمداً انجامش می‌دهیم.
      #
      # ملاکِ موفقیت خطِ لاگِ «ready on» است، نه صرفاً زنده ماندنِ پروسه: اگر
      # RegisterHotKey شکست بخورد، برنامه یک پنجره‌ی خطا نشان می‌دهد و همچنان
      # زنده می‌مانَد — یعنی «هنوز اجرا می‌شود» شاهدِ راه‌اندازیِ موفق نیست.
      - name: آزمایشِ راه‌اندازیِ کاملِ برنامه
        run: |
          $exe = (Resolve-Path "dist\mlqvoice\mlqvoice.exe").Path
          $err = Join-Path $env:RUNNER_TEMP 'app-err.txt'
          $out = Join-Path $env:RUNNER_TEMP 'app-out.txt'
          $before = @(Get-Process chrome, msedge -ErrorAction SilentlyContinue).Id

          $started = Get-Date
          $app = Start-Process -FilePath $exe -PassThru `
                   -RedirectStandardOutput $out -RedirectStandardError $err

          # چرا این زمان اندازه گرفته می‌شود: شکایتِ اصلیِ مالک همین بود —
          # «خیلی دیر لود می‌کنه و تا وقتی بازش نکردی هرچی کلید بزنی جواب نمی‌ده».
          # onedir برای همین آمد. ولی «حس می‌کنم سریع‌تر شد» شاهد نیست، و بدونِ
          # عدد هیچ‌کس نمی‌فهمد اگر فردا دوباره کند شود. ۵۰۰ms فاصله‌ی نمونه‌برداری
          # یعنی دقت در همین حد است؛ برای بودجه‌ای که واحدش ثانیه است کافی است.
          $ready = $false
          $readyMs = 0
          $deadline = (Get-Date).AddSeconds(75)
          while ((Get-Date) -lt $deadline) {
            if ($app.HasExited) { break }
            $log = Get-Content $err -Raw -Encoding utf8 -ErrorAction SilentlyContinue
            if ($log -match 'ready on') {
              $ready = $true
              $readyMs = [int]((Get-Date) - $started).TotalMilliseconds
              break
            }
            Start-Sleep -Milliseconds 500
          }

          $log = Get-Content $err -Raw -Encoding utf8 -ErrorAction SilentlyContinue
          Write-Host "--- لاگِ برنامه ---"
          if ($log) { Write-Host $log } else { Write-Host "(خالی)" }

          $chromeNow = @(Get-Process chrome, msedge -ErrorAction SilentlyContinue)
          $ours = @($chromeNow | Where-Object { $before -notcontains $_.Id })

          # پاک‌سازی قبل از هر throw، وگرنه رانر با پروسه‌های یتیم می‌مانَد
          foreach ($p in $ours) { try { $p.Kill() } catch { } }
          if (-not $app.HasExited) { try { $app.Kill() } catch { } }
          # بسته‌ی onefile یک پروسه‌ی فرزند می‌سازد و کشتنِ والد او را نمی‌کشد؛
          # در اجرای قبل یک mlqvoiceِ یتیم در پاک‌سازیِ رانر باقی مانده بود.
          Get-Process mlqvoice -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          if ($app.HasExited -and -not $ready) {
            throw "برنامه بالا نماند — کدِ خروجی $($app.ExitCode). لاگ بالاست."
          }
          if (-not $ready) {
            throw "برنامه تا ۷۵ ثانیه «ready on» نگفت — راه‌اندازی نیمه‌کاره ماند"
          }
          if ($ours.Count -eq 0) {
            throw "مرورگرِ تشخیصِ گفتار بالا نیامد — بدونِ آن هیچ صدایی تبدیل نمی‌شود"
          }

          $sec = [math]::Round($readyMs / 1000, 1)
          Write-Host "راه‌اندازی کامل شد در $sec ثانیه و $($ours.Count) پروسه‌ی مرورگر بالا آمد."
          "READY_SECONDS=$sec" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # بودجه، نه فقط گزارش: عددی که چاپ می‌شود و هیچ‌کس رویش شرط نگذاشته،
          # بی‌صدا بزرگ می‌شود. سقف با دستِ باز بسته شده چون رانرِ مشترکِ گیت‌هاب
          # کندتر و پرنوسان‌تر از لپ‌تاپِ مالک است — این عدد جلوی «دوباره چند
          # برابر شد» را می‌گیرد، نه اینکه کندیِ چندصد میلی‌ثانیه‌ای را شکار کند.
          if ($readyMs -gt 20000) {
            throw "راه‌اندازی $sec ثانیه طول کشید — بیش از بودجه‌ی ۲۰ ثانیه‌ای"
          }

      - name: بارگذاریِ exe
        uses: actions/upload-artifact@v4
        with:
          name: mlqvoice-exe
          path: voice/dist/mlqvoice.zip
          if-no-files-found: error
          retention-days: 30

      - name: خلاصه
        if: always()
        run: |
          @(
            '### mlqvoice روی ویندوز'
            ''
            "- تست‌ها روی ``windows-latest`` اجرا شدند"
            "- exe: ``$env:EXE_SIZE`` مگابایت"
            "- زمانِ راه‌اندازی تا آماده‌شدنِ کلیدِ میان‌بُر: ``$env:READY_SECONDS`` ثانیه"
            '- از بخشِ Artifacts همین اجرا دانلودش کن'
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  # artifactها موقت‌اند: با `retention-days: 30` گیت‌هاب خودش پاکشان می‌کند و
  # لینک ۴۰۴ می‌دهد. برای فایلی که مالک باید هر وقت خواست دوباره نصبش کند،
  # این یعنی هر بار باید وارد Actions شود و یک build تازه بزند.
  #
  # Release پاک نمی‌شود. و عمداً یک برچسبِ **چرخان** است (`voice-latest`) نه
  # نسخه‌دار، چون خواسته یک **نشانیِ ثابت** بود که بشود ذخیره‌اش کرد:
  #
  #   https://github.com/mhmdpwrpdram801-cpu/modlandqeshm/releases/download/voice-latest/mlqvoice.zip
  #
  # بهایش این است که نسخه‌ی قبلی نگه داشته نمی‌شود — با یک کاربر و یک exe که
  # همیشه از آخرین main ساخته می‌شود، معامله‌ی درستی است.
  release:
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # تنها جایی در این گردش‌کار که اجازه‌ی نوشتن دارد؛ کارِ build فقط‌خواندنی می‌مانَد.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mlqvoice-exe

      # اسکریپتِ نصب اثرِ انگشتِ همین بسته را در خودش دارد، پس باید بعد از
      # ساخته‌شدنِ zip مهر بخورد. جاگذاریِ متنی است تا اسکریپت بدونِ هیچ
      # آرگومانی قابلِ اجرا بماند — کاربر فقط یک خط کپی می‌کند.
      - name: مهرِ اثرِ انگشت روی اسکریپتِ نصب
        run: |
          set -euo pipefail
          sha=$(sha256sum mlqvoice.zip | cut -d' ' -f1)
          sed "s/__SHA256__/${sha}/" voice/scripts/install.ps1 > install.ps1
          grep -q "$sha" install.ps1 || { echo "::error::جاگذاریِ اثرِ انگشت انجام نشد"; exit 1; }
          grep -q '__SHA256__' install.ps1 && { echo "::error::جای‌نگه‌دار هنوز مانده"; exit 1; }

          # sed باید BOM را دست‌نخورده رد کند. اگر روزی نکند، فارسیِ اسکریپت روی
          # PowerShell 5.1 خراب می‌شود و هیچ‌کس تا رسیدنِ عکسِ کاربر نمی‌فهمد.
          if [ "$(head -c 3 install.ps1 | od -An -tu1 | tr -s ' ' | sed 's/^ //')" != "239 187 191" ]; then
            echo "::error::BOM در فایلِ مهرخورده نماند — فارسی خراب می‌شود"
            exit 1
          fi
          echo "SHA256=$sha" >> "$GITHUB_ENV"
          echo "اثرِ انگشت: $sha"

      - name: انتشار روی نشانیِ ثابت
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: voice-latest
        run: |
          set -euo pipefail
          size=$(stat -c %s mlqvoice.zip)
          notes="ساخته‌شده از \`${GITHUB_SHA:0:7}\` — $(date -u '+%Y-%m-%d %H:%M UTC')

          ## نصب — یک خط، بدونِ اخطارِ ویندوز

          **اول PowerShell را باز کن** (این خط در مرورگر کار نمی‌کند):

          1. کلیدِ **ویندوز** را با **R** بزن
          2. بنویس \`powershell\` و اینتر
          3. پنجره‌ای باز می‌شود که اولِ خطش \`PS C:\\Users\\...>\` است — همان‌جا

          حالا این را بچسبان و اینتر بزن:

          \`\`\`powershell
          \$s=\"\$env:TEMP\\mlqvoice-install.ps1\"; iwr https://github.com/${GITHUB_REPOSITORY}/releases/download/voice-latest/install.ps1 -OutFile \$s; powershell -ExecutionPolicy Bypass -File \$s
          \`\`\`

          > **چرا \`irm … | iex\` نه:** در Windows PowerShell 5.1 آن دستور متنِ
          > اسکریپت را Latin-1 می‌خوانَد (گیت‌هاب charset اعلام نمی‌کند)، پس
          > پیام‌های فارسی **پیش از اجرا** خراب می‌شوند و به‌جای «از منوی استارت
          > اجرا کن» چیزی مثل \`Ø§Ø¬Ø±Ø§:\` می‌بینی. نصب درست انجام می‌شود ولی
          > نمی‌فهمی بعدش چه کار کنی. دستورِ بالا فایل را خام دانلود می‌کند، پس
          > هیچ رمزگشایی‌ای وسط نیست.

          دانلود می‌کند، اثرِ انگشتش را وارسی می‌کند، در \`%LOCALAPPDATA%\\mlqvoice\`
          باز می‌کند و در منوی استارت میان‌بُر می‌سازد. چون فایل را **وارسی‌شده**
          باز می‌کند، اخطارِ SmartScreen اصلاً نمی‌آید.

          ## بعد از نصب — این قدم را جا نینداز

          نصب برنامه را **اجرا نمی‌کند**. تا اجرا نشود، Alt+Space هیچ کاری نمی‌کند
          چون چیزی بالا نیامده که به کلید جواب بدهد.

          1. کلیدِ **ویندوز** را بزن، تایپ کن \`mlqvoice\`، اینتر
          2. یک آیکن کنارِ ساعت (سینیِ سیستم) ظاهر می‌شود — یعنی آماده است
          3. **حالا** هر جا که بودی \`Alt+Space\` را بزن

          ## هرچه بیشتر کار کنی، کمتر اشتباه می‌کند

          برنامه از **ویرایش‌های خودت** یاد می‌گیرد: هر بار متنِ داخلِ کادر را
          قبل از زدنِ «بنویس» دستی درست کنی، همان تفاوت را نگه می‌دارد.

          راست‌کلیک روی آیکنِ کنارِ ساعت:

          - **آنچه یاد گرفته** — ببین چه چیزهایی جمع شده
          - **آموخته‌ها را به دیکشنری اضافه کن** — یک کلیک، و همان لحظه فعال

          هرچه بیشتر کار کنی کمتر اشتباه می‌کند. هیچ‌چیزش جایی فرستاده نمی‌شود.

          اثرِ انگشتِ این نسخه (SHA-256):

          \`\`\`
          ${SHA256}
          \`\`\`

          ## یا دستی

          \`\`\`
          https://github.com/${GITHUB_REPOSITORY}/releases/download/voice-latest/mlqvoice.zip
          \`\`\`

          zip را باز کن و mlqvoice.exe را اجرا کن. این‌طوری ویندوز اخطارِ
          SmartScreen می‌دهد (More info ← Run anyway) — چون فایل امضای دیجیتال
          ندارد، و طبقِ مستنداتِ مایکروسافت امضا هم این اخطار را برنمی‌دارد تا
          وقتی فایل اعتبارِ دانلودِ انبوه جمع نکرده باشد."

          # `--repo` روی هر چهار فرمان لازم است، نه از سرِ وسواس: این کار مخزن را
          # checkout نمی‌کند (فقط artifact را می‌گیرد)، پس هیچ ریموتِ گیتی نیست که
          # gh بتواند از رویش حدس بزند کجا را می‌گوید. بدونش با
          # «fatal: not a git repository» می‌افتد — و اولین بار همین‌طور افتاد.
          #
          # جایگزینی به‌جای حذف و ساختِ دوباره: پاک کردنِ Release یک فاصله‌ی
          # چندثانیه‌ای می‌سازد که در آن همان نشانیِ «ثابت» ۴۰۴ می‌دهد.
          # onefile گذشته یک mlqvoice.exe روی همین Release گذاشته بود؛ اگر بماند،
          # لینکِ قدیمی یک نسخه‌ی منجمد را برای همیشه سرو می‌کند.
          gh release delete-asset "$TAG" mlqvoice.exe --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" mlqvoice.zip install.ps1 --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --notes "$notes" --title "mlqvoice (تازه‌ترین)"
          else
            gh release create "$TAG" mlqvoice.zip install.ps1 --repo "$GITHUB_REPOSITORY" \
              --title "mlqvoice (تازه‌ترین)" --notes "$notes" --latest
          fi
          echo "منتشر شد: $size بایت"

      # «فرمان خطا نداد» با «فایل واقعاً آنجاست» یکی نیست. این مرحله همان
      # نشانیِ عمومی را می‌گیرد و اندازه‌اش را با فایلِ ساخته‌شده مقابله می‌کند —
      # وگرنه یک Releaseِ خالی یا نیمه‌آپلود سبز رد می‌شد.
      - name: وارسیِ اینکه لینک واقعاً کار می‌کند
        env:
          TAG: voice-latest
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/mlqvoice.zip"
          expected=$(stat -c %s mlqvoice.zip)
          # tolower، نه IGNORECASE: آن یکی افزونه‌ی gawk است و mawk — که awkِ
          # پیش‌فرضِ اوبونتوست — بی‌صدا نادیده‌اش می‌گیرد. نتیجه‌اش این می‌شد که
          # فقط `content-length` کوچکِ پاسخِ ۳۰۲ می‌خواند، یعنی صفر، و این وارسی
          # روی یک Releaseِ کاملاً سالم قرمز می‌داد. اندازه گرفته شد.
          for attempt in 1 2 3 4 5; do
            served=$(curl -sIL "$url" | awk '
              { line = tolower($0); if (line ~ /^content-length:/) v = $2 }
              END { gsub(/\r/, "", v); print v + 0 }')
            if [ "$served" = "$expected" ]; then
              echo "لینک جواب داد و اندازه خواند: $expected بایت"
              echo "- دانلودِ دائمی: <$url>" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            echo "تلاشِ $attempt: اندازه‌ی سرو‌شده «${served:-هیچ}» با $expected نخواند؛ صبر…"
            sleep 5
            if [ "$attempt" = 5 ]; then
              echo "::error::لینکِ Release بعد از ۵ تلاش فایلِ درست را نداد: $url"
              exit 1
            fi
          done

          # و مهم‌تر: اسکریپتی که به مالک می‌گوییم اجرا کند، باید اثرِ انگشتِ
          # همین فایلِ منتشرشده را داشته باشد. اگر نخوانَد، اسکریپت روی کامپیوترِ
          # او می‌ایستد و می‌گوید فایل دستکاری شده — یعنی یک نصبِ شکسته که علتش
          # اینجاست نه آنجا. پس همین‌جا سنجیده می‌شود، نه آنجا.
          script_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.ps1"
          published=$(sha256sum mlqvoice.zip | cut -d' ' -f1)
          for attempt in 1 2 3 4 5; do
            curl -sL "$script_url" -o published.ps1 || true
            body=$(cat published.ps1 2>/dev/null || true)
            if printf '%s' "$body" | grep -q "$published"; then
              # همان‌جا BOM را هم می‌سنجیم: فایلی که منتشر شده باید همانی باشد
              # که مهر خورد. «آپلود خطا نداد» با «فایلِ درست آنجاست» یکی نیست.
              got=$(head -c 3 published.ps1 | od -An -tu1 | tr -s ' ' | sed 's/^ //')
              if [ "$got" != "239 187 191" ]; then
                echo "::error::install.ps1 منتشرشده BOM ندارد — فارسی‌اش خراب می‌شود"
                exit 1
              fi
              echo "اسکریپتِ نصب اثرِ انگشتِ درست را دارد: $published"
              # عمداً `irm … | iex` نیست: همان دستوری نوشته می‌شود که در
              # یادداشتِ انتشار به مالک داده‌ایم. دو جای متفاوت با دو دستورِ
              # متفاوت یعنی یکی‌شان تست نمی‌شود.
              echo "- اسکریپتِ نصب: <$script_url>" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "تلاشِ $attempt: اسکریپتِ نصب هنوز اثرِ انگشتِ درست را ندارد؛ صبر…"
            sleep 5
          done
          echo "::error::install.ps1 منتشرشده اثرِ انگشتِ zip را ندارد — نصب روی دستگاهِ کاربر می‌افتد"
          exit 1
