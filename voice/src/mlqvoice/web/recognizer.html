<!doctype html>
<html lang="fa" dir="rtl">
<meta charset="utf-8">
<title>mlqvoice — تشخیصِ گفتار</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; font: 13px system-ui, sans-serif;
    background: #14161a; color: #cfd6e4;
    display: flex; align-items: center; justify-content: center; height: 100vh;
  }
  #s { padding: 0 12px; text-align: center; }
  .bad { color: #ff8a8a; }
</style>
<div id="s">در حالِ اتصال…</div>
<script>
"use strict";
const TOKEN = "__TOKEN__";
const el = document.getElementById("s");

function say(text, bad) {
  el.textContent = text;
  el.className = bad ? "bad" : "";
}

function post(path, body) {
  // keepalive so a result still leaves the page if the window is being torn down.
  return fetch(path + "?t=" + encodeURIComponent(TOKEN), {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Token": TOKEN },
    body: JSON.stringify(body),
    keepalive: true,
  }).catch(() => {});
}

function status(state, detail) {
  post("/status", { state: state, detail: detail || "" });
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  say("این مرورگر Web Speech API ندارد. کروم لازم است.", true);
  status("unsupported", navigator.userAgent);
}

let rec = null;
let wantRunning = false;   // what the app asked for
let running = false;       // what the engine is actually doing
let restartTimer = null;

// Restarting is normal: Chrome ends the session by itself after a stretch of
// silence, and picking it straight back up is what makes dictation feel
// continuous.  Restarting *after a failure* is a different thing wearing the
// same clothes.  The first version could not tell them apart and retried every
// 250ms for ever — on a dropped VPN that is four requests a second at Google,
// indefinitely, from a window positioned off-screen where nobody can see it.
//
// The error is what separates the two cases, so no clock is needed: a session
// that ended quietly (or with "no speech") was healthy and earns an immediate
// retry, while anything else backs off and eventually gives up and says so.
const RESTART_BASE = 250;
const RESTART_MAX = 10000;
const RESTART_LIMIT = 12;   // ≈ a minute of trying before we admit defeat
// "" is the no-error case: Chrome simply ended the session.
const ROUTINE_END = ["", "no-speech", "aborted"];
let sessionError = "";
let failures = 0;

function restartDelay() {
  if (failures === 0) return RESTART_BASE;
  return Math.min(RESTART_BASE * Math.pow(2, failures - 1), RESTART_MAX);
}

function build(lang, interim) {
  const r = new SR();
  r.lang = lang || "fa-IR";
  r.continuous = true;
  r.interimResults = !!interim;
  r.maxAlternatives = 1;

  r.onstart = () => { running = true; say("در حالِ شنیدن…"); status("listening"); };

  r.onresult = (ev) => {
    let interimText = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const res = ev.results[i];
      const text = res[0].transcript;
      if (res.isFinal) {
        post("/result", { text: text, final: true });
      } else {
        interimText += text;
      }
    }
    if (interimText) post("/result", { text: interimText, final: false });
  };

  r.onerror = (ev) => {
    sessionError = ev.error || "";
    // "no-speech" and "aborted" are routine; only the rest are worth reporting.
    if (ROUTINE_END.indexOf(sessionError) !== -1) return;
    say("خطا: " + sessionError, true);
    status("error", sessionError);
    if (sessionError === "not-allowed" || sessionError === "service-not-allowed") {
      wantRunning = false;
    }
  };

  r.onend = () => {
    running = false;
    if (!wantRunning) {
      say("آماده");
      status("idle");
      return;
    }
    // Chrome ends the session on its own after a stretch of silence. If the user
    // has not asked us to stop, that is not the end of anything — restart.
    if (ROUTINE_END.indexOf(sessionError) !== -1) {
      failures = 0;   // it was working; the next hiccup starts from scratch
    } else {
      failures++;
    }
    if (failures > RESTART_LIMIT) {
      // Hammering a service that is not answering helps nobody, and a silent
      // retry loop in an invisible window is indistinguishable from the app
      // being broken. Stop, and make sure the box says why.
      wantRunning = false;
      failures = 0;
      say("سرویسِ تشخیصِ گفتار جواب نمی‌دهد", true);
      status("error", "unreachable");
      return;
    }
    clearTimeout(restartTimer);
    restartTimer = setTimeout(() => {
      sessionError = "";
      try { r.start(); } catch (e) {}
    }, restartDelay());
  };
  return r;
}

function start(lang, interim) {
  wantRunning = true;
  failures = 0;         // a fresh press of the hotkey deserves a fresh start
  sessionError = "";
  if (!rec) rec = build(lang, interim);
  rec.lang = lang || "fa-IR";
  rec.interimResults = !!interim;
  if (running) return;
  try {
    rec.start();
  } catch (e) {
    // start() throws if the engine is already going; onend will re-drive it.
    status("error", String(e && e.message || e));
  }
}

function stop() {
  wantRunning = false;
  clearTimeout(restartTimer);
  if (rec && running) rec.stop();
}

const src = new EventSource("/events?t=" + encodeURIComponent(TOKEN));
src.onopen = () => { say("آماده"); status("ready"); };
src.onerror = () => say("ارتباط با برنامه قطع شد — دوباره وصل می‌شوم…", true);
src.onmessage = (ev) => {
  let msg;
  try { msg = JSON.parse(ev.data); } catch (e) { return; }
  if (msg.cmd === "start") start(msg.lang, msg.interim);
  else if (msg.cmd === "stop") stop();
};

window.addEventListener("pagehide", () => status("gone"));
</script>
</html>
