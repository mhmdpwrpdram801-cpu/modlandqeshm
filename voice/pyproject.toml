[project]
name = "mlqvoice"
version = "0.1.0"
description = "Persian speech-to-text for Windows, tuned for programmers"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    # Reads Core Audio session state, which is how the app knows whether the
    # media key would pause something or start it. Windows-only by nature, and
    # the app degrades to leaving playback alone when it is missing.
    "pycaw>=20240210; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6.6",
]

[project.scripts]
mlqvoice = "mlqvoice.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlqvoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
