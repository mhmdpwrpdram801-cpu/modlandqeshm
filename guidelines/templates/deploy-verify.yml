# انتشار + وارسیِ بعد از انتشار — قالب
#
# **این فایل خودکار نصب نمی‌شود.** انتشار به هدف و رمزِ همان پروژه بند است، و
# گذاشتنِ یک گردش‌کارِ انتشار در مخزنِ کسی بدونِ اینکه بداند، کارِ درستی نیست.
# خودت کپی‌اش کن در `.github/workflows/` و جاهای TODO را پر کن.
#
# چیزی که این قالب اضافه می‌کند و یک `deploy` معمولی ندارد، دو چیز است:
#
#   OPS-06 — بعد از استقرار **وارسی کن که واقعاً همان نسخه زنده شده**، نه اینکه
#            فرمانِ استقرار بدونِ خطا تمام شد. اینها یکی نیستند.
#   OPS-07 — نسخه‌ی کش/دارایی با هر انتشار جلو برود، وگرنه کاربر نسخه‌ی قدیمی
#            را می‌بیند و تو فکر می‌کنی منتشر شده.
#
# دامی که در مخزنِ منبع خوردیم: بعد از یک انتشارِ کاملاً موفق، `curl` روی `/`
# محتوای **قدیمی** برگرداند چون از کشِ لبه آمد. **با پارامترِ تصادفی بگیر.**

name: انتشار

on:
  push:
    branches: [main]
    paths:
      - 'TODO-پوشه‌ی-برنامه/**'   # TODO: مسیرِ فایل‌هایی که منتشر می‌شوند
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main          # دو انتشارِ هم‌زمان همدیگر را خراب می‌کنند
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }   # برای مقایسه با کامیتِ قبلی

      # ── پیش از انتشار ────────────────────────────────────────────────────
      - name: نسخه‌ی کش جلو رفته؟ (OPS-07)
        run: |
          # TODO: مسیرِ فایلی که نسخه‌ی کش در آن است و الگویش
          FILE="TODO-پوشه‌ی-برنامه/sw.js"
          if git diff --name-only HEAD~1 HEAD | grep -q '^TODO-پوشه‌ی-برنامه/'; then
            if git diff HEAD~1 HEAD -- "$FILE" | grep -q '^+.*CACHE'; then
              echo "✅ نسخه‌ی کش جلو رفته"
            else
              echo "::error::کدِ برنامه عوض شده ولی نسخه‌ی کش جلو نرفته (OPS-07)"
              exit 1
            fi
          fi

      - name: دروازه‌ها قبل از انتشار
        run: python3 guidelines/run-gates.py

      # ── انتشار ───────────────────────────────────────────────────────────
      - name: استقرار
        run: |
          echo "TODO — فرمانِ استقرارِ خودت را اینجا بگذار"
          exit 1
        # مثال: npx wrangler deploy   /   npx vercel deploy --prod
        # رمزها از Settings → Secrets می‌آیند، نه از کد (SEC-01، ARCH-05).

      # ── بعد از انتشار ────────────────────────────────────────────────────
      - name: واقعاً همان نسخه زنده شد؟ (OPS-06)
        run: |
          # TODO: نشانیِ سایت و نشانه‌ای که فقط در نسخه‌ی تازه هست
          SITE="https://TODO.example.com"
          MARK="$(git rev-parse --short HEAD)"
          for i in 1 2 3 4 5 6; do
            # پارامترِ تصادفی، وگرنه جوابِ کشِ لبه را می‌گیری و گمراه می‌شوی
            BODY="$(curl -fsS "$SITE/?cachebust=$RANDOM$RANDOM" || true)"
            if printf '%s' "$BODY" | grep -q "$MARK"; then
              echo "✅ نسخه‌ی تازه زنده است"; exit 0
            fi
            echo "· هنوز نه — تلاشِ $i"; sleep 10
          done
          echo "::error::استقرار بدونِ خطا تمام شد ولی سایتِ زنده نسخه‌ی تازه را نمی‌دهد (OPS-06)"
          exit 1
