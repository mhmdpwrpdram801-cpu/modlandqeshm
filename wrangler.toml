# انتشارِ پنل روی Cloudflare Workers (Static Assets).
# این ورکر کدِ اجرایی ندارد — فقط همان ۱۳ فایلِ پوشه‌ی panel/ را سرو می‌کند،
# دقیقاً مثلِ وقتی که پوشه را دستی از داشبورد آپلود می‌کردیم.
#
# تنظیماتِ پیش‌فرض عمداً دست‌نخورده مانده‌اند تا رفتار عوض نشود:
#   · مسیرِ ناموجود  → 404  (نه بازگشت به index.html)
#   · /index.html    → 307 به /
# هر دو با رفتارِ فعلیِ سایتِ زنده وارسی شدند.

name = "modlandqeshm4374"
compatibility_date = "2026-08-07"
workers_dev = true

[assets]
directory = "./panel"
