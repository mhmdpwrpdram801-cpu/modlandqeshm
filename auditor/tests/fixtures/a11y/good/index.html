<!DOCTYPE html><html dir="rtl" lang="fa"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>a11y — سالم</title>
<style>
 body{font-family:Tahoma,sans-serif;margin:0;padding:12px;background:#fff;color:#111}
 .overlay{position:fixed;inset:0;background:#ffffff;padding:20px;z-index:9}
 .hidden{display:none}
 button{font:inherit}
</style></head><body>

<button style="width:48px;height:48px" onclick="openModal()" aria-label="بستن">×</button>
<button id="outside" style="width:80px;height:48px">بیرون</button>
<label for="i1">نام</label><input id="i1" placeholder="نام" style="height:48px">
<label for="i2">تلفن</label><input id="i2" style="height:48px">
<img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="60" height="60" alt="نشان">
<div class="overlay hidden" id="ov">
  <label for="m1">در پنجره</label><input id="m1" style="height:48px">
  <button id="m2" style="width:90px;height:48px">تأیید</button>
</div>
<script>
function openModal(){ document.getElementById('ov').classList.remove('hidden'); }
document.getElementById('ov').addEventListener('keydown', function(e){
  if(e.key !== 'Tab') return;
  const f = [...this.querySelectorAll('input,button')];
  const i = f.indexOf(document.activeElement);
  e.preventDefault();
  f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
});
</script></body></html>
