<!DOCTYPE html><html dir="rtl" lang="fa"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ساعتِ زنده</title>
<style>
 body{font-family:Tahoma,sans-serif;margin:0;padding:12px;background:#fff;color:#111}
 .overlay{position:fixed;inset:0;background:#ffffff;padding:20px;z-index:9}
 .hidden{display:none}
 button{font:inherit}
</style></head><body>

<div id="clock" style="font-size:38px;line-height:44px;height:340px;overflow:hidden;
     background:#eee;word-break:break-all"></div>
<div style="width:100%;height:200px;background:#2244ee"></div>
<div>متنِ ثابت</div>
<script>
function show(){ document.title = 'ok'; }
function tick(){
  document.getElementById('clock').textContent = String(Date.now()).slice(-6).repeat(60);
}
tick(); setInterval(tick, 60);
</script></body></html>
